services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["research-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research"]
      interval: 5s
      retries: 10
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/research-password
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["research-neo4j:/data"]
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["research-qdrant:/qdrant/storage"]
volumes:
  research-postgres:
  research-neo4j:
  research-qdrant:
